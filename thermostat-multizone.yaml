# ============================================================
# SCRIPTS — PAR ZONE
# ============================================================

script:

  # ---- ZONE 0 — Maison ----

  - id: envoyer_consigne_ha_maison
    mode: restart
    then:
      - delay: 2s
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: climate.zone0
            temperature: !lambda |-
              return id(consigne_locale_maison);

  - id: appliquer_mode_local_maison
    parameters:
      mode: string
    then:
      - lambda: |-
          id(mode_local_maison) = mode;

      - if:
          condition:
            lambda: 'return mode == "off";'
          then:
            - lvgl.widget.hide:
                id: cool_arc_maison
            - lvgl.widget.hide:
                id: heat_arc_maison
            - lvgl.widget.update:
                id: button_off_maison
                bg_color: 0x555555
            - lvgl.widget.update:
                id: button_clim_maison
                bg_color: 0x202020
            - lvgl.widget.update:
                id: button_heat_maison
                bg_color: 0x202020
            - lvgl.label.update:
                id: consigne_label_maison
                text: "OFF"

      - if:
          condition:
            lambda: 'return mode == "cool";'
          then:
            - lvgl.widget.show:
                id: cool_arc_maison
            - lvgl.widget.hide:
                id: heat_arc_maison
            - lvgl.widget.update:
                id: button_off_maison
                bg_color: 0x202020
            - lvgl.widget.update:
                id: button_clim_maison
                bg_color: 0x03A9F4
            - lvgl.widget.update:
                id: button_heat_maison
                bg_color: 0x202020
            - lvgl.label.update:
                id: consigne_label_maison
                text:
