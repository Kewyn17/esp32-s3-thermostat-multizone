# ============================================================
# LVGL
# ============================================================

lvgl:

  id: thermostat_ui

  displays:
    - main_display

  touchscreens:
    - my_touchscreen

  color_depth: 16

  disp_bg_color: 0x000000

  refresh_interval: 30ms

  pages:

    - id: page_zone0

      bg_color: 0x000000

      on_swipe_left:
        - lambda: |-
            id(current_zone) = (id(current_zone) + 1) % 8;
        - if:
            condition:
              lambda: 'return id(current_zone) == 0;'
            then:
              - lvgl.page.show:
                  id: page_zone0
                  animation: MOVE_LEFT
                  time: 200ms

        - if:
            condition:
              lambda: 'return id(current_zone) == 1;'
            then:
              - lvgl.page.show:
                  id: page_zone1
                  animation: MOVE_LEFT
                  time: 200ms

        - if:
            condition:
              lambda: 'return id(current_zone) == 2;'
            then:
              - lvgl.page.show:
                  id: page_zone2
