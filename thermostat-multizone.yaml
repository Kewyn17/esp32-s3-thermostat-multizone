# ============================================================
# THERMOSTAT — MULTI-ZONES
# Waveshare ESP32-S3 Knob Touch LCD 1.8 B
# ESPHome 2026.8.1
#
# 8 zones, navigation par swipe gauche/droite (boucle)
# Timer, navigation par swipe haut/bas
# ============================================================

esphome:
  name: thermostat-zone0
  friendly_name: Thermostat zone0 Multizone


# ============================================================
# ESP32-S3
# ============================================================

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB

  framework:
    type: esp-idf


# ============================================================
# PSRAM
# ============================================================

psram:
  mode: octal
  speed: 80MHz


# ============================================================
# EXTERNAL COMPONENTS
# ============================================================

external_components:

  - source:
      type: git
      url: https://github.com/KrX3D/WaveShare-Knob-Esp32S3
      ref: main
    refresh: 1d


# ============================================================
# LOGGER
# ============================================================

logger:
  level: DEBUG
  baud_rate: 0


# ============================================================
# API
# ============================================================

api:


# ============================================================
# OTA
# ============================================================

ota:
  - platform: esphome


# ============================================================
# WIFI
# ============================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


# ============================================================
# SPI — LCD
# ============================================================

spi:
  id: display_qspi
  type: quad

  clk_pin: GPIO13

  data_pins:
    - GPIO15
    - GPIO16
    - GPIO17
    - GPIO18


# ============================================================
# I2C — TOUCH
# ============================================================

i2c:
  id: ic_bus

  sda: GPIO11
  scl: GPIO12

  scan: true

# ============================================================
# GLOBALS — GÉNÉRAUX (partagés entre zones)
# ============================================================

globals:

  # Index de la zone actuellement affichée (0..7)
  - id: current_zone
    type: int
    restore_value: no
    initial_value: '0'

  - id: ecran_veille
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ignore_touch_reveil
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: on_timer_page
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: duree_timer
    type: int
    restore_value: no
    initial_value: '60'

  - id: timer_total_minutes
    type: int
    restore_value: no
    initial_value: '0'

  - id: timer_actif
    type: bool
    restore_value: no
    initial_value: 'false'


  # ---- Zone 0 : zone0 ----
  - id: consigne_locale_zone0
    type: float
    restore_value: no
    initial_value: '20.0'

  - id: derniere_rotation_zone0
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: mode_local_zone0
    type: std::string
    restore_value: no
    initial_value: '"off"'

  # ---- Zone 1 : zone1 ----
  - id: consigne_locale_zone1
    type: float
    restore_value: no
    initial_value: '20.0'

  - id: derniere_rotation_zone1
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: mode_local_zone1
    type: std::string
    restore_value: no
    initial_value: '"off"'

  # ---- Zone 2 : zone2 ----
  - id: consigne_locale_zone2
    type: float
    restore_value: no
    initial_value: '20.0'

  - id: derniere_rotation_zone2
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: mode_local_zone2
    type: std::string
    restore_value: no
    initial_value: '"off"'

  # ---- Zone 3 : zone3 ----
  - id: consigne_locale_zone3
    type: float
    restore_value: no
    initial_value: '20.0'

  - id: derniere_rotation_zone3
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: mode_local_zone3
    type: std::string
    restore_value: no
    initial_value: '"off"'

  # ---- Zone 4 : zone4 ----
  - id: consigne_locale_sdb
    type: float
    restore_value: no
    initial_value: '20.0'

  - id: derniere_rotation_sdb
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: mode_local_sdb
    type: std::string
    restore_value: no
    initial_value: '"off"'

  # ---- Zone 5 : zone5 ----
  - id: consigne_locale_zone5
    type: float
    restore_value: no
    initial_value: '20.0'

  - id: derniere_rotation_zone5
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: mode_local_zone5
    type: std::string
    restore_value: no
    initial_value: '"off"'

  # ---- Zone 6 : zone6 ----
  - id: consigne_locale_zone6
    type: float
    restore_value: no
    initial_value: '20.0'

  - id: derniere_rotation_zone6
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: mode_local_zone6
    type: std::string
    restore_value: no
    initial_value: '"off"'

  # ---- Zone 7 : zone7 ----
  - id: consigne_locale_zone7
    type: float
    restore_value: no
    initial_value: '20.0'

  - id: derniere_rotation_zone7
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: mode_local_zone7
    type: std::string
    restore_value: no
    initial_value: '"off"'


# ============================================================
# DEEP SLEEP
# Réveil par le tactile CST816
# ============================================================

deep_sleep:

  id: thermostat_sleep

  wakeup_pin:
    number: GPIO9
    mode: INPUT_PULLUP
    inverted: true
    allow_other_uses: true

  wakeup_pin_mode: KEEP_AWAKE


switch:

  - platform: template

    name: "Veille profonde"

    id: deep_sleep_switch

    entity_category: config

    optimistic: true

    turn_on_action:

      - deep_sleep.enter:

          id: thermostat_sleep

# ============================================================
# DISPLAY
# ============================================================

display:

  - platform: mipi_spi

    id: main_display

    model: JC3636W518V2

    data_rate: 80MHz

    color_order: RGB

    rotation: 0

    invert_colors: true

    auto_clear_enabled: false

    update_interval: never

    dimensions:
      width: 360
      height: 360

    cs_pin: GPIO14

    reset_pin: GPIO21


# ============================================================
# TOUCHSCREEN
# ============================================================

touchscreen:

  - platform: cst816

    id: my_touchscreen

    display: main_display

    interrupt_pin:
      number: GPIO9
      allow_other_uses: true

    reset_pin: GPIO10

    on_touch:

      then:

        - if:

            condition:

              lambda: 'return id(ecran_veille);'

            then:

              - lambda: |-

                  id(ignore_touch_reveil) = true;

              - light.turn_on:

                  id: back_light

              - delay: 300ms

              - lambda: |-

                  id(ignore_touch_reveil) = false;


# ============================================================
# BACKLIGHT
# ============================================================

output:

  - platform: ledc

    id: backlight_pwm

    pin: GPIO47

    frequency: 20000 Hz


light:

  - platform: monochromatic

    id: back_light

    name: "Rétroéclairage"

    output: backlight_pwm

    restore_mode: ALWAYS_ON

    default_transition_length: 0s

    on_turn_off:

      - lambda: |-

          id(ecran_veille) = true;

    on_turn_on:

      - lambda: |-

          id(ecran_veille) = false;


# ============================================================
# FONTS
# ============================================================

font:

  - file: "gfonts://Roboto"
    id: font_target
    size: 58
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_temperature
    size: 23
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_zonename
    size: 35
    bpp: 4

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icon
    size: 38
    bpp: 4
    glyphs:
      - "\U000F0425"   # power
      - "\U000F0717"   # snowflake
      - "\U000F0238"   # fire


# ============================================================
# SENSORS — BATTERIE + PAR ZONE
# ============================================================

sensor:

  # =========================================
  # BATTERIE
  # =========================================

  - platform: adc
    pin: GPIO1
    name: "Batterie - Tension"
    id: batterie_tension
    attenuation: 12db
    update_interval: 30s
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 2.0

  - platform: template
    name: "Batterie"
    id: batterie_pourcentage
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      float v = id(batterie_tension).state;
      if (v >= 4.20) return 100.0;
      if (v >= 4.10) return 90.0;
      if (v >= 4.00) return 80.0;
      if (v >= 3.90) return 70.0;
      if (v >= 3.80) return 55.0;
      if (v >= 3.70) return 40.0;
      if (v >= 3.60) return 28.0;
      if (v >= 3.50) return 18.0;
      if (v >= 3.40) return 12.0;
      if (v >= 3.30) return 8.0;
      if (v >= 3.10) return 4.0;
      if (v >= 3.00) return 2.0;
      return 0.0;

  # ==========================================================
  # ZONE 0 — zone0 — TEMPÉRATURE
  # ==========================================================

  - platform: homeassistant

    id: temperature_zone_zone0

    entity_id: sensor.temperature_zone0

    internal: true

    on_value:

      then:

        - lvgl.label.update:

            id: temperature_label_zone0

            text:

              format: "%.1f °C"

              args:
                - x

        - lvgl.widget.update:

            id: temperature_dot_zone0

            x: !lambda |-

              float t = x;

              if (t < 16.0f)
                t = 16.0f;

              if (t > 30.0f)
                t = 30.0f;

              float p =
                (t - 16.0f) / 14.0f;

              float angle =
                200.0f - (p * 220.0f);

              float rad =
                angle * 3.14159265f / 180.0f;

              return (int)(165.0f * cosf(rad));

            y: !lambda |-

              float t = x;

              if (t < 16.0f)
                t = 16.0f;

              if (t > 30.0f)
                t = 30.0f;

              float p =
                (t - 16.0f) / 14.0f;

              float angle =
                200.0f - (p * 220.0f);

              float rad =
                angle * 3.14159265f / 180.0f;

              return (int)(-165.0f * sinf(rad));

  # ==========================================================
  # ZONE 0 — zone0 — CONSIGNE
  # ==========================================================

  - platform: homeassistant

    id: consigne_zone_zone0

    entity_id: climate.zone0

    attribute: temperature

    internal: true

    on_value:
      then:

        - lambda: |-

            if (millis() - id(derniere_rotation_zone0) > 3000) {
              if (!isnan(x)) {
                id(consigne_locale_zone0) = x;
              }
            }

        - if:
            condition:
              lambda: 'return id(mode_local_zone0) == "off";'
            then:
              - lvgl.label.update:
                  id: consigne_label_zone0
                  text: "OFF"
            else:
              - lvgl.label.update:
                  id: consigne_label_zone0
                  text:
                    format: "%.1f °C"
                    args:
                      - id(consigne_locale_zone0)

