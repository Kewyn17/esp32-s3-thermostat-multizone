  - platform: rotary_encoder_custom

    id: rotary_counter

    name: "Molette"

    pin_a: GPIO8
    pin_b: GPIO7

    min_value: -1000
    max_value: 1000

    restore_mode: ALWAYS_ZERO

    publish_initial_value: false

    on_clockwise:

      then:

        - if:
            condition:
              lambda: 'return !id(ecran_veille);'
