  # ==========================================================
  # MINUTERIE — DURÉE RESTANTE (calculée côté HA)
  # ==========================================================

  - platform: homeassistant

    id: timer_minutes_restantes

    entity_id: sensor.pac_zone0_minuterie_restante

    internal: true

    on_value:

      then:

        - lvgl.arc.update:
            id: timer_ring
            value: !lambda |-
              if (isnan(x) || x <= 0.0f || id(timer_total_minutes) <= 0) {
                return (int)(
                  ((float)(id(duree_timer) - 15) / (float)(240 - 15)) * 100.0f
                );
              }
              float frac = x / (float)id(timer_total_minutes);
              if (frac > 1.0f) frac = 1.0f;
              if (frac < 0.0f) frac = 0.0f;
              return (int)(frac * 100.0f);

        - lvgl.label.update:
            id: timer_duration_label
            text: !lambda |-
              char buf[16];
              if (isnan(x) || x <= 0.0f) {
                snprintf(buf, sizeof(buf), "%d min", id(duree_timer));
              } else {
                snprintf(buf, sizeof(buf), "%d min", (int)(x + 0.5f));
              }
              return std::string(buf);

