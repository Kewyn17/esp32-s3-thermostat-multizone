  # ==========================================================

  - platform: homeassistant

    id: timer_script_state

    entity_id: script.timer_pac_zone0

    internal: true

    on_value:

      then:

        - lambda: |-
            id(timer_actif) = (x == "on");

        - if:
            condition:
              lambda: 'return x == "on";'
            then:
