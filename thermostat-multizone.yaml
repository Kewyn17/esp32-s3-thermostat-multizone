# ============================================================
# LVGL
# ============================================================

lvgl:

  id: thermostat_ui

  displays:
    - main_display

  touchscreens:
    - my_touchscreen

  color_depth: 16

  disp_bg_color: 0x000000

  refresh_interval: 30ms

  pages:

    - id: page_maison

      bg_color: 0x000000

      on_swipe_left:
        - lambda: |-
            id(current_zone) = (id(current_zone) + 1) % 8;
        - lvgl.page.next:
            animation: MOVE_LEFT
            time: 200ms

      on_swipe_right:
        - lambda: |-
            id(current_zone) = (id(current_zone) + 7) % 8;
        - lvgl.page.previous:
            animation: MOVE_RIGHT
            time: 200ms

      widgets:

        - label:
            align: CENTER
            x: 0
            y: -90
            text: "Maison"
            text_font: font_zonename
            text_color: 0xf9cb9c
            text_align: CENTER

        - arc:
            id: temperature_arc_maison
            align: CENTER
            x: 0
            y: 0
            width: 310
            height: 310
            start_angle: 160
            end_angle: 20
            min_value: 0
            max_value: 100
            value: 100
            adjustable: false
            arc_width: 14
            arc_rounded: true
            arc_color: 0x3A3A3A
            arc_opa: 100%
            indicator:
              arc_opa: 0%
            knob:
              bg_opa: 0%

        - arc:
            id: cool_arc_maison
            align: CENTER
            x: 0
            y: 0
            width: 310
            height: 310
            start_angle: 160
            end_angle: 20
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            mode: REVERSE
            arc_width: 14
            arc_rounded: true
            arc_color: 0x000000
            arc_opa: 0%
            indicator:
              arc_color: 0x03A9F4
              arc_opa: 100%
              arc_width: 14
              arc_rounded: true
            knob:
              bg_opa: 0%

        - arc:
            id: heat_arc_maison
            align: CENTER
            x: 0
            y: 0
            width: 310
            height: 310
            start_angle: 160
            end_angle: 20
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            mode: NORMAL
            arc_width: 14
            arc_rounded: true
            arc_color: 0x000000
            arc_opa: 0%
            indicator:
              arc_color: 0xFF9800
              arc_opa: 100%
              arc_width: 14
              arc_rounded: true
            knob:
              bg_opa: 0%
            hidden: true

        - obj:
            id: temperature_dot_maison
            align: CENTER
            x: 0
            y: 0
            width: 18
            height: 18
            radius: 9
            bg_color: 0xFFFFFF
            bg_opa: 100%
            border_width: 2
            border_color: 0x101010
            border_opa: 100%
            clickable: false

        - label:
            id: consigne_label_maison
            align: CENTER
            x: 0
            y: -25
            text: "--.- °C"
            text_font: font_target
            text_color: 0xFFFFFF
            text_align: CENTER

        - label:
            id: temperature_label_maison
            align: CENTER
            x: 0
            y: 38
            text: "--.- °C"
            text_font: font_temperature
            text_color: 0xA0A0A0
            text_align: CENTER

        - button:
            id: button_off_maison
            x: 68
            y: 252
            width: 64
            height: 64
            radius: 32
            bg_color: 0x202020
            border_width: 0
            shadow_width: 0
            clickable: true
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0425"
                  text_font: font_icon
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(ignore_touch_reveil);'
                  then:
                    - script.execute:
                        id: appliquer_mode_local_maison
                        mode: "off"
                    - homeassistant.action:
                        action: climate.set_hvac_mode
                        data:
                          entity_id: climate.zone0
                          hvac_mode: "off"

        - button:
            id: button_clim_maison
            x: 148
            y: 252
            width: 64
            height: 64
            radius: 32
            bg_color: 0x202020
            border_width: 0
            shadow_width: 0
            clickable: true
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0717"
                  text_font: font_icon
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(ignore_touch_reveil);'
                  then:
                    - script.execute:
                        id: appliquer_mode_local_maison
                        mode: "cool"
                    - homeassistant.action:
                        action: climate.set_hvac_mode
                        data:
                          entity_id: climate.zone0
                          hvac_mode: "cool"

        - button:
            id: button_heat_maison
            x: 228
            y: 252
            width: 64
            height: 64
            radius: 32
            bg_color: 0x202020
            border_width: 0
            shadow_width: 0
            clickable: true
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0238"
                  text_font: font_icon
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(ignore_touch_reveil);'
                  then:
                    - script.execute:
                        id: appliquer_mode_local_maison
                        mode: "heat"
                    - homeassistant.action:
                        action: climate.set_hvac_mode
                        data:
