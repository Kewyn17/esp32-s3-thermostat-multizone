  # ==========================================================
  # ZONE 7 — Parents — TEMPÉRATURE
  # ==========================================================

  - platform: homeassistant

    id: temperature_zone_parents

    entity_id: sensor.temperature_zone7

    internal: true

    on_value:

      then:

        - lvgl.label.update:

            id: temperature_label_parents

            text:

              format: "%.1f °C"

              args:
                - x

        - lvgl.widget.update:

            id: temperature_dot_parents

            x: !lambda |-

              float t = x;

              if (t < 16.0f)
                t = 16.0f;

              if (t > 30.0f)
                t = 30.0f;

              float p =
                (t - 16.0f) / 14.0f;

              float angle =
                200.0f - (p * 220.0f);

              float rad =
                angle * 3.14159265f / 180.0f;

              return (int)(165.0f * cosf(rad));

            y: !lambda |-

              float t = x;

              if (t < 16.0f)
                t = 16.0f;

              if (t > 30.0f)
                t = 30.0f;

              float p =
                (t - 16.0f) / 14.0f;

              float angle =
                200.0f - (p * 220.0f);

              float rad =
                angle * 3.14159265f / 180.0f;

              return (int)(-165.0f * sinf(rad));

