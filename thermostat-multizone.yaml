  - platform: homeassistant

    id: consigne_zone_zone6

    entity_id: climate.zone6

    attribute: temperature

    internal: true

    on_value:
      then:

        - lambda: |-

            if (millis() - id(derniere_rotation_zone6) > 3000) {
              if (!isnan(x)) {
                id(consigne_locale_zone6) = x;
              }
            }

        - if:
            condition:
              lambda: 'return id(mode_local_zone6) == "off";'
            then:
              - lvgl.label.update:
                  id: consigne_label_zone6
                  text: "OFF"
            else:
              - lvgl.label.update:
                  id: consigne_label_zone6
                  text:
                    format: "%.1f °C"
                    args:
                      - id(consigne_locale_zone6)

  # ==========================================================
  # ZONE 7 — zone7 — TEMPÉRATURE
  # ==========================================================

  - platform: homeassistant

    id: temperature_zone_zone7

    entity_id: sensor.temperature_zone7

    internal: true

    on_value:

      then:

        - lvgl.label.update:

            id: temperature_label_zone7

            text:

              format: "%.1f °C"

              args:
                - x

        - lvgl.widget.update:

            id: temperature_dot_zone7

            x: !lambda |-

              float t = x;

              if (t < 16.0f)
                t = 16.0f;

              if (t > 30.0f)
                t = 30.0f;

              float p =
                (t - 16.0f) / 14.0f;

              float angle =
                200.0f - (p * 220.0f);

              float rad =
                angle * 3.14159265f / 180.0f;

              return (int)(165.0f * cosf(rad));

            y: !lambda |-

              float t = x;

              if (t < 16.0f)
                t = 16.0f;

              if (t > 30.0f)
                t = 30.0f;

              float p =
                (t - 16.0f) / 14.0f;

              float angle =
                200.0f - (p * 220.0f);

              float rad =
                angle * 3.14159265f / 180.0f;

              return (int)(-165.0f * sinf(rad));

