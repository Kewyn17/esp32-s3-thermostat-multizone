              - lvgl.page.show:
                  id: page_zone7
                  animation: MOVE_TOP
                  time: 200ms


      on_swipe_down:
        - lambda: |-
            id(on_timer_page) = false;
        - if:
            condition:
              lambda: 'return id(current_zone) == 0;'
            then:
              - lvgl.page.show:
                  id: page_zone0
                  animation: MOVE_BOTTOM
                  time: 200ms

        - if:
            condition:
              lambda: 'return id(current_zone) == 1;'
            then:
              - lvgl.page.show:
                  id: page_zone1
                  animation: MOVE_BOTTOM
                  time: 200ms

        - if:
            condition:
              lambda: 'return id(current_zone) == 2;'
            then:
              - lvgl.page.show:
                  id: page_zone2
                  animation: MOVE_BOTTOM
                  time: 200ms

        - if:
            condition:
              lambda: 'return id(current_zone) == 3;'
            then:
              - lvgl.page.show:
                  id: page_zone3
                  animation: MOVE_BOTTOM
                  time: 200ms

        - if:
            condition:
              lambda: 'return id(current_zone) == 4;'
            then:
              - lvgl.page.show:
                  id: page_sdb
                  animation: MOVE_BOTTOM
                  time: 200ms

        - if:
            condition:
              lambda: 'return id(current_zone) == 5;'
            then:
              - lvgl.page.show:
                  id: page_zone5
                  animation: MOVE_BOTTOM
                  time: 200ms

        - if:
            condition:
              lambda: 'return id(current_zone) == 6;'
            then:
              - lvgl.page.show:
                  id: page_zone6
                  animation: MOVE_BOTTOM
                  time: 200ms

        - if:
            condition:
              lambda: 'return id(current_zone) == 7;'
            then:
              - lvgl.page.show:
                  id: page_zone7
                  animation: MOVE_BOTTOM
                  time: 200ms


      widgets:

        - label:
            align: CENTER
            x: 0
            y: -90
            text: "Minuterie"
            text_font: font_zonename
            text_color: 0x8fce00
            text_align: CENTER

        - arc:
            id: timer_ring_bg
            align: CENTER
            x: 0
            y: 0
            width: 310
            height: 310
            start_angle: 0
            end_angle: 360
            rotation: 270
            min_value: 0
            max_value: 100
            value: 100
            adjustable: false
            arc_width: 14
            arc_rounded: true
            arc_color: 0x3A3A3A
            arc_opa: 100%
            indicator:
              arc_opa: 0%
            knob:
              bg_opa: 0%

        - arc:
            id: timer_ring
            align: CENTER
            x: 0
            y: 0
            width: 310
            height: 310
            start_angle: 0
            end_angle: 360
            rotation: 270
            min_value: 0
            max_value: 100
            value: !lambda |-
              return (int)(
                ((float)(id(duree_timer) - 15) / (float)(240 - 15)) * 100.0f
              );
            adjustable: false
            mode: NORMAL
            arc_width: 14
            arc_rounded: true
            arc_color: 0x000000
            arc_opa: 0%
            indicator:
              arc_color: 0x4CAF50
              arc_opa: 100%
              arc_width: 14
              arc_rounded: true
            knob:
              bg_opa: 0%

        - label:
            id: timer_duration_label
            align: CENTER
            x: 0
            y: -25
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%d min", id(duree_timer));
              return std::string(buf);
            text_font: font_target
            text_color: 0xFFFFFF
            text_align: CENTER

        - button:
            id: button_cool_timer
            x: 88
            y: 210
            width: 64
            height: 64
            radius: 32
            bg_color: 0x03A9F4
            border_width: 0
            shadow_width: 0
            clickable: true
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0717"
                  text_font: font_icon
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(ignore_touch_reveil);'
                  then:
                    - lambda: |-
                        id(timer_total_minutes) = id(duree_timer);
                    - homeassistant.action:
                        action: script.timer_pac_zone0
                        data:
                          mode: "cool"
                          duree: !lambda 'return id(duree_timer);'

        - button:
            id: button_heat_timer
            x: 208
            y: 210
            width: 64
            height: 64
            radius: 32
            bg_color: 0xFF9800
            border_width: 0
            shadow_width: 0
            clickable: true
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0238"
                  text_font: font_icon
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(ignore_touch_reveil);'
                  then:
                    - lambda: |-
                        id(timer_total_minutes) = id(duree_timer);
                    - homeassistant.action:
                        action: script.timer_pac_zone0
                        data:
                          mode: "heat"
                          duree: !lambda 'return id(duree_timer);'

        - button:
            id: button_stop_timer
            x: 148
            y: 210
            width: 64
            height: 64
            radius: 32
            bg_color: 0xE53935
            border_width: 0
            shadow_width: 0
            clickable: true
            hidden: true
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0425"
                  text_font: font_icon
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(ignore_touch_reveil);'
                  then:
                    - homeassistant.action:
                        action: automation.trigger
                        data:
                          entity_id: automation.stop_script_timer_pac
                    - lvgl.widget.hide:
                        id: button_stop_timer
                    - lvgl.widget.show:
                        id: button_cool_timer
                    - lvgl.widget.show:
                        id: button_heat_timer
                    - lvgl.label.update:
                        id: timer_duration_label
                        text: !lambda |-
                          char buf[16];
                          snprintf(buf, sizeof(buf), "%d min", id(duree_timer));
                          return std::string(buf);
                    - lvgl.arc.update:
                        id: timer_ring
                        value: !lambda |-
                          return (int)(
                            ((float)(id(duree_timer) - 15) / (float)(240 - 15)) * 100.0f
                          );
