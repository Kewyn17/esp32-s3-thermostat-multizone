    attribute: temperature

    internal: true

    on_value:
      then:

        - lambda: |-

            if (millis() - id(derniere_rotation_ZONE6) > 3000) {
              if (!isnan(x)) {
                id(consigne_locale_ZONE6) = x;
              }
            }

        - if:
